[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rank-bm25-rs"
description = "Fast drop-in replacement for rank_bm25: the same BM25 scores, bit for bit, from a Rust core"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alex Kholodniak", email = "alexandrkholodniak@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy"]
keywords = ["bm25", "rank_bm25", "search", "information-retrieval", "ranking", "rag", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://syntaxspirits.dev/rank-bm25-rs"
Repository = "https://github.com/SyntaxSpirits/rank-bm25-rs"
Issues = "https://github.com/SyntaxSpirits/rank-bm25-rs/issues"

[dependency-groups]
dev = ["pytest", "hypothesis", "rank-bm25==0.2.2"]
bench = ["rank-bm25==0.2.2", "pyarrow"]

[tool.maturin]
python-source = "python"
module-name = "rank_bm25_rs._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["python/rank_bm25_rs/_reference.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["rank_bm25_rs"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../../crates/rank-bm25/Cargo.toml" },
    { file = "../../crates/rank-bm25/src/**/*.rs" },
]
